<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>产品演示视频</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif}
.container{width:100%;max-width:800px;padding:16px}
video{width:100%;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.title{text-align:center;color:#fff;font-size:16px;margin-top:16px;font-weight:600;letter-spacing:1px}
.subtitle{text-align:center;color:rgba(255,255,255,.5);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="container">
<video controls playsinline webkit-playsinline preload="metadata">
<source src="demo.mp4" type="video/mp4">
</video>
<p class="title">AI套件 · 工资管理 产品演示</p>
<p class="subtitle">Kingdee AI Suite · Payroll Management</p>

</html>
