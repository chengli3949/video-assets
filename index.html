<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<title>AI套件·工资管理 产品演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif;color:#fff;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:12px 16px}
.video-wrap{position:relative;width:100%;border-radius:12px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5);background:#000;margin-top:12px;aspect-ratio:9/16}
.video-wrap video{width:100%;height:100%;display:block;object-fit:contain}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);color:#fff;font-size:14px}
.loading.hide{display:none}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:#4880ed;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{margin-top:8px;color:rgba(255,255,255,.7);font-size:13px}
.title{margin-top:18px;font-size:16px;font-weight:600;letter-spacing:1px;text-align:center}
.sub{margin-top:6px;font-size:12px;color:rgba(255,255,255,.5);text-align:center}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;display:block;padding:13px 16px;background:linear-gradient(135deg,#1f5fd1,#4880ed);color:#fff;text-decoration:none;text-align:center;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 4px 12px rgba(31,95,209,.3)}
.btn.secondary{background:linear-gradient(135deg,#7c5cdb,#8f6cf0);box-shadow:0 4px 12px rgba(124,92,219,.3)}
.tip{margin:16px 0 20px;padding:10px 14px;background:rgba(255,255,255,.06);border-radius:8px;color:rgba(255,255,255,.6);font-size:12px;line-height:1.6;text-align:center}

.wechat-mask{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:none;flex-direction:column;align-items:center;padding:40px 24px;text-align:center}
.wechat-mask.show{display:flex}
.arrow{position:absolute;top:14px;right:24px;width:60px;height:60px;animation:bounce 1.2s ease-in-out infinite}
.arrow svg{width:100%;height:100%}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.mask-title{margin-top:90px;font-size:20px;font-weight:700;color:#ffd84d}
.mask-steps{margin-top:18px;color:rgba(255,255,255,.85);font-size:15px;line-height:2}
.mask-steps b{color:#ffd84d;font-weight:600}
.mask-btn{margin-top:28px;padding:14px 32px;background:#ffd84d;color:#0d1117;border:none;border-radius:26px;font-size:16px;font-weight:700;box-shadow:0 6px 20px rgba(255,216,77,.4)}
.mask-sub{margin-top:16px;font-size:12px;color:rgba(255,255,255,.5)}
</style>
</head>
<body>

<div class="wechat-mask" id="wxmask">
  <div class="arrow">
    <svg viewBox="0 0 60 60" fill="none"><path d="M10 50 Q20 20 50 15" stroke="#ffd84d" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M42 8 L52 14 L46 24" stroke="#ffd84d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <p class="mask-title">当前为微信内置浏览器</p>
  <p class="mask-steps">
    请点右上角 <b>···</b><br>
    选择 <b>在浏览器打开</b><br>
    即可流畅观看演示视频
  </p>
  <button class="mask-btn" id="wxbtn" onclick="copyLink()">复制链接</button>
  <p class="mask-sub" id="copied-tip">复制成功后，切到 Safari / Chrome 粘贴打开</p>
</div>

<div class="container">
  <div class="video-wrap">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>视频加载中…</div>
      <div class="progress" id="progress">0%</div>
    </div>
    <video id="v" controls playsinline webkit-playsinline preload="none" poster="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 16'><rect width='9' height='16' fill='%23111'/><polygon points='3.5,6 3.5,10 6.5,8' fill='%23fff'/></svg>">
      您的浏览器不支持视频播放，请下载后观看。
    </video>
  </div>
  <p class="title">AI套件 · 工资管理 产品演示</p>
  <p class="sub">Kingdee AI Suite · Payroll Management</p>
  <div class="actions">
    <a class="btn" href="demo.mp4" target="_blank" rel="noopener" download>下载视频</a>
  </div>
  <p class="tip">如加载较慢，建议点「下载视频」保存到本地观看</p>
</div>

<script>
(function(){
  var ua = navigator.userAgent.toLowerCase();
  var isWx = /micromessenger/.test(ua);
  if(isWx) document.getElementById('wxmask').classList.add('show');

  document.getElementById('wxbtn').addEventListener('click', function(){
    var url = location.href;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){
        document.getElementById('wxbtn').textContent = '已复制 ✓';
        document.getElementById('copied-tip').textContent = '请切到 Safari / Chrome 粘贴打开';
      }).catch(fallbackCopy);
    } else { fallbackCopy(); }
    function fallbackCopy(){
      var ta = document.createElement('textarea');
      ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); document.getElementById('wxbtn').textContent='已复制 ✓'; }
      catch(e){ alert('请手动长按链接复制：\n' + url); }
      document.body.removeChild(ta);
    }
  });

  var video = document.getElementById('v');
  var loading = document.getElementById('loading');
  var progress = document.getElementById('progress');

  // 用 fetch 加载成 Blob，绕开 Range 限制
  fetch('demo.mp4').then(function(resp){
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    var reader = resp.body.getReader();
    var total = parseInt(resp.headers.get('Content-Length') || '0', 10);
    var received = 0;
    var chunks = [];
    function pump(){
      return reader.read().then(function(r){
        if(r.done) return;
        chunks.push(r.value);
        received += r.value.length;
        if(total > 0){
          progress.textContent = Math.round(received/total*100) + '%';
        } else {
          progress.textContent = (received/1024/1024).toFixed(1) + ' MB';
        }
        return pump();
      });
    }
    return pump().then(function(){
      var blob = new Blob(chunks, {type: 'video/mp4'});
      video.src = URL.createObjectURL(blob);
      loading.classList.add('hide');
      video.play().catch(function(){});
    });
  }).catch(function(err){
    // 降级：直接用 src
    progress.textContent = '加载失败，尝试直接播放…';
    video.src = 'demo.mp4';
    video.load();
    setTimeout(function(){ loading.classList.add('hide'); }, 1500);
  });
})();
</script>
</body>
</html>
